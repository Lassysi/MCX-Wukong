gradle.beforeProject { p ->
    p.plugins.withId('net.fabricmc.fabric-loom-remap') {
        def fixture = new File(p.rootDir, '../tests/block-support')
        p.sourceSets {
            blockSupport {
                java.srcDir new File(fixture, 'java')
                resources.srcDir new File(fixture, 'resources')
                compileClasspath += p.sourceSets.main.compileClasspath + p.sourceSets.main.output
                runtimeClasspath += p.sourceSets.main.runtimeClasspath + p.sourceSets.main.output
            }
        }
        p.loom {
            mods { blockSupport { sourceSet p.sourceSets.blockSupport } }
            runs {
                blockSupport {
                    server()
                    name 'Isolated underside support GameTest'
                    source p.sourceSets.blockSupport
                    runDir '../../test-world'
                    vmArg '-Dfabric-api.gametest'
                    vmArg '-Dfabric-api.gametest.report-file=reports/results.xml'
                    vmArg '-Dfile.encoding=UTF-8'
                }
            }
        }
    }
}
